name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/cache@v4
        with:
          path: public/mediapipe
          key: mediapipe-face-64184e229b263107bc2b804c6625db1341ff2bb731874b0bcc2fe6544e0bc9ff
      - run: npm ci
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/cache@v4
        with:
          path: public/mediapipe
          key: mediapipe-face-64184e229b263107bc2b804c6625db1341ff2bb731874b0bcc2fe6544e0bc9ff
      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      - name: Install Chromium and system dependencies
        env:
          PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT: 120000
        run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  windows-portable:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/cache@v4
        with:
          path: public/mediapipe
          key: mediapipe-face-64184e229b263107bc2b804c6625db1341ff2bb731874b0bcc2fe6544e0bc9ff
      - run: npm ci
      - run: npm run build
      - name: Smoke-test Node-free portable server
        shell: pwsh
        run: |
          $stdout = Join-Path $env:RUNNER_TEMP 'miao-portable-server.stdout.log'
          $stderr = Join-Path $env:RUNNER_TEMP 'miao-portable-server.stderr.log'
          $script = Join-Path $PWD 'portable-server.ps1'
          $env:MIAO_MOTION_NO_BROWSER = '1'
          $arguments = "-NoProfile -ExecutionPolicy Bypass -File `"$script`""
          $server = Start-Process powershell.exe -ArgumentList $arguments -PassThru `
            -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          try {
            $deadline = [DateTime]::UtcNow.AddSeconds(30)
            $homeResponse = $null
            while ([DateTime]::UtcNow -lt $deadline) {
              if ($server.HasExited) {
                throw "便携服务器提前退出，退出码 $($server.ExitCode)。"
              }
              try {
                $homeResponse = Invoke-WebRequest 'http://127.0.0.1:4173/' -UseBasicParsing -TimeoutSec 2
                break
              } catch {
                Start-Sleep -Milliseconds 500
              }
            }
            if ($null -eq $homeResponse) { throw '便携服务器在 30 秒内未就绪。' }
            if ($homeResponse.StatusCode -ne 200 -or $homeResponse.Content -notmatch 'MIAO Motion') {
              throw '首页响应内容不正确。'
            }
            $help = Invoke-WebRequest 'http://127.0.0.1:4173/help.html' -UseBasicParsing -TimeoutSec 5
            if ($help.StatusCode -ne 200) { throw '离线帮助页不可访问。' }
            $license = Invoke-WebRequest 'http://127.0.0.1:4173/licenses/THIRD_PARTY_LICENSES.txt' -UseBasicParsing -TimeoutSec 5
            if ($license.StatusCode -ne 200 -or $license.Content -notmatch '@mediapipe/tasks-vision') {
              throw '第三方许可证目录不可访问。'
            }
            $head = Invoke-WebRequest 'http://127.0.0.1:4173/' -Method Head -UseBasicParsing -TimeoutSec 5
            if ($head.StatusCode -ne 200) { throw 'HEAD 请求检查失败。' }
            function Get-HttpStatus([string]$Uri, [string]$Method = 'GET') {
              try {
                return (Invoke-WebRequest $Uri -Method $Method -UseBasicParsing -TimeoutSec 5).StatusCode
              } catch [System.Net.WebException] {
                return [int]$_.Exception.Response.StatusCode
              }
            }
            if ((Get-HttpStatus 'http://127.0.0.1:4173/not-found.txt') -ne 404) { throw '缺失文件未返回 404。' }
            if ((Get-HttpStatus 'http://127.0.0.1:4173/' 'POST') -ne 405) { throw '非 GET/HEAD 请求未返回 405。' }
            if ((Get-HttpStatus 'http://127.0.0.1:4173/%2e%2e/%2e%2e/Windows/win.ini') -notin @(403, 404)) { throw '目录穿越请求未被拒绝。' }
          } finally {
            if ($server -and -not $server.HasExited) {
              Stop-Process -Id $server.Id -Force
              $server.WaitForExit()
            }
            if (Test-Path $stdout) { Get-Content $stdout }
            if (Test-Path $stderr) { Get-Content $stderr }
            Remove-Item Env:MIAO_MOTION_NO_BROWSER -ErrorAction SilentlyContinue
          }
      - name: Package Node-free portable build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path portable/MIAO-Motion-portable | Out-Null
          Copy-Item dist, docs, start-portable.bat, portable-server.ps1, README.md, LICENSE, THIRD_PARTY_NOTICES.md -Destination portable/MIAO-Motion-portable -Recurse
          Compress-Archive -Path portable/MIAO-Motion-portable -DestinationPath MIAO-Motion-portable.zip
          $hash = (Get-FileHash MIAO-Motion-portable.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  MIAO-Motion-portable.zip" | Set-Content MIAO-Motion-portable.zip.sha256 -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: MIAO-Motion-portable-windows
          path: |
            MIAO-Motion-portable.zip
            MIAO-Motion-portable.zip.sha256
          if-no-files-found: error
          retention-days: 14

  windows-desktop:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: public/mediapipe
          key: mediapipe-face-64184e229b263107bc2b804c6625db1341ff2bb731874b0bcc2fe6544e0bc9ff
      - run: npm ci
      - run: npm run desktop:build
      - uses: actions/upload-artifact@v4
        with:
          name: MIAO-Motion-Tauri-Windows
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 14
