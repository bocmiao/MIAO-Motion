name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: public/mediapipe
          key: mediapipe-face-64184e229b263107bc2b804c6625db1341ff2bb731874b0bcc2fe6544e0bc9ff
      - run: npm ci
      - run: npm run build
      - run: npm run desktop:build -- -- --locked
      - name: Install DirectShow test receiver
        run: choco install ffmpeg --no-progress -y
      - name: Smoke-test installed application
        shell: pwsh
        run: ./scripts/smoke-desktop.ps1
      - name: Package portable build and checksums
        shell: pwsh
        run: |
          ./scripts/package-portable.ps1 -Output release
          Copy-Item src-tauri/target/release/bundle/nsis/*-setup.exe release/
          node scripts/release-checksums.mjs release
      - name: Smoke-test extracted portable package
        shell: pwsh
        run: ./scripts/smoke-portable.ps1 -Zip release/MIAO-Motion-portable.zip
      - name: Publish explicitly marked beta (stable tags remain drafts)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = @(Get-ChildItem release -File | ForEach-Object FullName)
          $mode = if ('${{ github.ref_name }}' -match '-beta') { '--prerelease' } else { '--draft' }
          gh release create '${{ github.ref_name }}' @files $mode --verify-tag --notes-file docs/BETA_RELEASE_NOTES.md --title 'MIAO Motion ${{ github.ref_name }}'
      - name: Optional domestic mirror upload (owner-configured endpoint)
        shell: pwsh
        env:
          MIAO_MIRROR_URL: ${{ vars.MIAO_MIRROR_URL }}
          MIAO_MIRROR_TOKEN: ${{ secrets.MIAO_MIRROR_TOKEN }}
        run: |
          if (-not $env:MIAO_MIRROR_URL -or -not $env:MIAO_MIRROR_TOKEN) {
            Write-Host '未配置国内镜像，未执行上传；GitHub 下载不受影响。'
            exit 0
          }
          $base = [Uri]$env:MIAO_MIRROR_URL
          if ($base.Scheme -ne 'https') { throw '镜像必须使用 HTTPS' }
          Get-ChildItem release -File | ForEach-Object {
            $url = $env:MIAO_MIRROR_URL.TrimEnd('/') + '/' + [Uri]::EscapeDataString($_.Name)
            Invoke-WebRequest -Uri $url -Method Put -InFile $_.FullName -Headers @{ Authorization = "Bearer $env:MIAO_MIRROR_TOKEN" } -MaximumRedirection 0 | Out-Null
          }
      - uses: actions/upload-artifact@v4
        with:
          name: MIAO-Motion-release-candidate
          path: release/*
          if-no-files-found: error
          retention-days: 14
