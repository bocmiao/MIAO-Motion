name: Bug 报告
description: 报告可以复现的程序问题；请勿上传无授权模型或敏感日志。
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: 请先确认使用最新版本，并删除日志中的用户名、路径、令牌和模型内容。
  - type: input
    id: version
    attributes:
      label: MIAO Motion 版本或提交
      placeholder: v0.2.1 / 44aa315
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 系统与硬件
      description: Windows 版本、浏览器、CPU/GPU、摄像头；不知道的项目可写“不清楚”。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: 1. 导入…… 2. 点击…… 3. 出现……
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望与实际结果
    validations:
      required: true
  - type: textarea
    id: model
    attributes:
      label: 模型特征
      description: 只写 VRM 0.x/1.0、导出工具、是否含表情等特征，不要上传无授权模型。
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我没有附带摄像头画面、OBS 密码、访问令牌或无授权模型。
          required: true
