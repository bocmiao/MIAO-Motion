<svg xmlns="http://www.w3.org/2000/svg" width="900" height="230" viewBox="0 0 900 230" role="img" aria-labelledby="title desc"><title id="title">创建和导入角色的两条路线</title><desc id="desc">猫咪路线：在喵动创建，实时试动，保存角色库。进阶人形路线：在 VRoid 编辑外观，导出 VRM，回喵动导入。</desc><rect width="900" height="230" rx="14" fill="#f4f1e8"/><g font-family="sans-serif" fill="#252a36"><text x="25" y="40" font-size="20" font-weight="bold">原创猫咪 · 在喵动完成</text><text x="25" y="155" font-size="20" font-weight="bold">进阶人形 · 使用 VRoid</text></g><g fill="#fff" stroke="#b8b1a4"><rect x="25" y="60" width="230" height="52" rx="8"/><rect x="335" y="60" width="230" height="52" rx="8"/><rect x="645" y="60" width="230" height="52" rx="8"/><rect x="25" y="172" width="230" height="42" rx="8"/><rect x="335" y="172" width="230" height="42" rx="8"/><rect x="645" y="172" width="230" height="42" rx="8"/></g><g font-family="sans-serif" font-size="18" text-anchor="middle" fill="#252a36"><text x="140" y="93">创建我的角色 → 捏脸换装</text><text x="450" y="93">拖动预览 → 开摄像头试动</text><text x="760" y="93">保存角色库 / 导出 VRM</text><text x="140" y="199">选择预设 → 编辑外观</text><text x="450" y="199">导出 VRM 1.0</text><text x="760" y="199">回喵动 → 导入我的角色</text></g><g fill="none" stroke="#356969" stroke-width="3"><path d="M270 86h48m-10-8 10 8-10 8M580 86h48m-10-8 10 8-10 8M270 193h48m-10-8 10 8-10 8M580 193h48m-10-8 10 8-10 8"/></g></svg>
