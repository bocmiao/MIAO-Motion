<h1>喵小动 · 原创猫咪示例</h1>
<p>这只猫咪由喵动项目中的程序生成：奶油色毛发、深青色套装、黄色徽章。几何、配色、骨骼和嘴型都可以从源码重新生成，没有使用 pixiv 或其他第三方角色的数据。</p>
<p>允许任何人使用、企业商用、修改和再分发，不要求署名。角色使用范围以文件内 VRM 1.0 元数据和 VRM 公共许可为准，不授予“喵动”商标所有权。不得用于文件许可排除的暴力、色情、仇恨或政治宗教用途。</p>
<p>目前是可换色、眨眼、张嘴、转头的简洁猫咪，手掌为猫爪造型，没有独立手指。需要精细手指追踪时，请导入带完整手指骨骼的 VRM。</p>
