[package]
name = "miao-motion"
version = "0.3.0"
description = "本地优先的 VRM 动漫角色实时动捕工具"
authors = ["MIAO Motion contributors"]
edition = "2021"
license = "MPL-2.0"

[lib]
name = "miao_motion_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }

[target.'cfg(windows)'.dependencies]
libloading = "0.8"
windows-sys = { version = "0.61", features = ["Win32_UI_Shell", "Win32_Foundation"] }
