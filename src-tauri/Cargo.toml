[package]
name = "miao-motion"
version = "0.3.1"
description = "本地优先的 VRM 动漫角色实时动捕工具"
authors = ["MIAO Motion contributors"]
edition = "2021"
license = "MPL-2.0"

[lib]
name = "miao_motion_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
percent-encoding = "2"
tauri = { version = "2.12", features = [] }

[target.'cfg(windows)'.dependencies]
rfd = { version = "0.15", default-features = false }
libloading = "0.8"
serde = { version = "1", features = ["derive"] }
windows-sys = { version = "0.61", features = ["Win32_UI_Shell", "Win32_Foundation", "Win32_System_Com", "Win32_System_Registry"] }
