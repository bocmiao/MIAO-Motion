<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="MIAO Motion：免费开源、本地优先的 VRM 动漫角色实时动捕工具" />
    <title>MIAO Motion / 喵动</title>
  </head>
  <body>
    <main class="app-shell">
      <header class="brand-bar">
        <a class="brand" href="/" aria-label="MIAO Motion 首页">
          <span class="brand-mark" aria-hidden="true">M</span>
          <span>MIAO Motion <small>喵动</small></span>
        </a>
        <span class="privacy-pill"><span></span> 摄像头与模型仅在本机处理</span>
      </header>

      <section class="intro" aria-labelledby="welcome-title">
        <p class="eyebrow">第一代可运行版本 · v0.2.0</p>
        <h1 id="welcome-title">三步，让你的角色动起来。</h1>
        <p>导入 VRM、打开摄像头、进入直播画面。无需注册，不上传素材。</p>
      </section>

      <section class="workspace">
        <aside class="control-panel" aria-label="动捕控制">
          <section class="step-card step-card--primary">
            <span class="step-number">1</span>
            <div class="step-copy">
              <strong>导入角色</strong>
              <span>支持 VRM 0.x / 1.0，最大 200 MB</span>
            </div>
            <button id="import-model" class="primary-button" type="button">选择 VRM</button>
            <input id="model-file" type="file" accept=".vrm,model/vrm" hidden />
          </section>

          <section class="step-card">
            <span class="step-number">2</span>
            <div class="step-copy">
              <strong>开启摄像头</strong>
              <span id="camera-status">尚未开启</span>
            </div>
            <button id="camera-toggle" class="secondary-button" type="button">开启摄像头</button>
          </section>

          <section class="tracking-card" aria-live="polite">
            <div class="tracking-title">
              <span id="tracking-dot" class="status-dot" data-state="idle"></span>
              <strong>实时动捕</strong>
            </div>
            <p id="tracking-status">等待开启摄像头</p>
            <button id="calibrate" class="text-button" type="button" disabled>正面校准</button>
          </section>

          <section class="model-doctor">
            <div>
              <strong>模型检查</strong>
              <span>导入后自动检查</span>
            </div>
            <ul id="diagnostics" hidden></ul>
          </section>

          <section class="broadcast-controls">
            <button id="background-toggle" class="soft-button" type="button">背景：影棚</button>
            <button id="broadcast-toggle" class="soft-button" type="button" disabled>进入直播画面</button>
            <button id="copy-obs-url" class="soft-button soft-button--wide" type="button" disabled>复制 OBS 浏览器源地址</button>
          </section>
        </aside>

        <section class="stage-card" aria-label="角色预览">
          <div class="stage-toolbar">
            <div>
              <strong id="model-name">角色预览</strong>
              <span id="model-status" role="status" aria-live="polite">把 VRM 文件拖到画面中，或点击左侧按钮</span>
            </div>
            <span class="local-badge">LOCAL</span>
          </div>

          <div id="stage" class="stage" tabindex="0" aria-label="将 VRM 文件拖到这里">
            <canvas id="avatar-canvas"></canvas>
            <div id="drop-hint" class="drop-hint">
              <span aria-hidden="true">↥</span>
              <strong>把 VRM 模型拖到这里</strong>
              <small>模型会保存在这个浏览器中，不会上传</small>
            </div>
            <video id="camera-preview" muted playsinline hidden aria-label="本机摄像头预览"></video>
          </div>
        </section>
      </section>

      <footer>
        <span>MIAO Motion v0.2.0 · MPL-2.0</span>
        <span>按 Esc 或双击直播画面可退出</span>
      </footer>
    </main>
    <div id="toast" class="toast" role="status" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
